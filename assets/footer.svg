<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 110" width="1000" height="110" role="img" aria-label="Always building.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.5" stop-color="#1B1A4B"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A5B4FC" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="110" fill="url(#bg)"/>
  <path fill="none" stroke="url(#trace)" stroke-width="1.5" stroke-dasharray="6 10"
        d="M0,80 Q25,62 50,80 T100,80 T150,80 T200,80 T250,80 T300,80 T350,80 T400,80 T450,80 T500,80 T550,80 T600,80 T650,80 T700,80 T750,80 T800,80 T850,80 T900,80 T950,80 T1000,80">
    <animate attributeName="stroke-dashoffset" values="0;-64" dur="2.5s" repeatCount="indefinite"/>
  </path>
  <text x="500" y="52" text-anchor="middle" font-family="'SFMono-Regular', Consolas, monospace" font-size="18" fill="#CBD5E1" letter-spacing="3">
    always building<tspan fill="#A5B4FC">_
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </tspan>
  </text>
</svg>
