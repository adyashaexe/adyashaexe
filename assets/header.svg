<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 310" width="1000" height="310" role="img" aria-label="Adyasha Mohanty. Machine learning, MLOps, software engineering.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#1B1A4B"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="loss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818CF8" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#818CF8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A5B4FC" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A5B4FC" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#A5B4FC" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#A5B4FC" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1000" height="310" fill="url(#bg)"/>
  <rect width="1000" height="310" fill="url(#grid)"/>

  <rect x="-160" y="0" width="160" height="310" fill="url(#sweep)">
    <animate attributeName="x" values="-160;1000" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- loss curve, faint, in the background -->
  <path pathLength="1" fill="none" stroke="url(#loss)" stroke-width="2" stroke-linecap="round" stroke-dasharray="1" stroke-dashoffset="1"
        d="M0,38 C90,38 150,120 280,142 C400,162 520,150 640,166 C760,180 880,172 1000,176">
    <animate attributeName="stroke-dashoffset" values="1;0;0;-1" keyTimes="0;0.5;0.8;1" dur="10s" repeatCount="indefinite"/>
  </path>
  <text x="26" y="30" font-family="'SFMono-Regular', Consolas, monospace" font-size="10" fill="#64748B" letter-spacing="2">LOSS</text>

  <!-- title -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <text x="500" y="84" font-size="54" font-weight="700" fill="#F1F5F9" letter-spacing="1.5">
      Adyasha Mohanty
      <animate attributeName="opacity" values="0;1" dur="1.4s" fill="freeze"/>
    </text>
    <text x="500" y="122" font-size="14" fill="#A5B4FC" letter-spacing="5">
      MACHINE LEARNING  ·  MLOPS  ·  SOFTWARE ENGINEERING
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4;1" dur="2.2s" fill="freeze"/>
    </text>
  </g>

  <!-- pipeline connectors -->
  <g stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" fill="none">
    <path d="M195,212 H245"/>
    <path d="M380,212 H430"/>
    <path d="M565,212 H615"/>
    <path d="M750,212 H800"/>
  </g>

  <!-- feedback loop -->
  <path id="loop" d="M870,238 C870,296 130,296 130,238" fill="none" stroke="#64748B" stroke-width="1.4" stroke-dasharray="5 7" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" values="0;-48" dur="3s" repeatCount="indefinite"/>
  </path>
  <text x="500" y="294" text-anchor="middle" font-family="'SFMono-Regular', Consolas, monospace" font-size="10" fill="#64748B" letter-spacing="3">RETRAIN ON DRIFT</text>

  <!-- stages -->
  <g font-family="'SFMono-Regular', Consolas, monospace" font-size="12" text-anchor="middle" letter-spacing="2" fill="#E2E8F0">
    <g>
      <rect x="65" y="192" width="130" height="40" rx="10" fill="#1E1B4B" stroke="#818CF8" stroke-width="1.5" stroke-opacity="0.35">
        <animate attributeName="stroke-opacity" values="1;0.35;0.35" keyTimes="0;0.25;1" dur="7.5s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <text x="130" y="217">DATA</text>
    </g>
    <g>
      <rect x="250" y="192" width="130" height="40" rx="10" fill="#1E1B4B" stroke="#818CF8" stroke-width="1.5" stroke-opacity="0.35">
        <animate attributeName="stroke-opacity" values="1;0.35;0.35" keyTimes="0;0.25;1" dur="7.5s" begin="1.5s" repeatCount="indefinite"/>
      </rect>
      <text x="315" y="217">TRAIN</text>
    </g>
    <g>
      <rect x="435" y="192" width="130" height="40" rx="10" fill="#1E1B4B" stroke="#818CF8" stroke-width="1.5" stroke-opacity="0.35">
        <animate attributeName="stroke-opacity" values="1;0.35;0.35" keyTimes="0;0.25;1" dur="7.5s" begin="3s" repeatCount="indefinite"/>
      </rect>
      <text x="500" y="217">EVALUATE</text>
    </g>
    <g>
      <rect x="620" y="192" width="130" height="40" rx="10" fill="#1E1B4B" stroke="#818CF8" stroke-width="1.5" stroke-opacity="0.35">
        <animate attributeName="stroke-opacity" values="1;0.35;0.35" keyTimes="0;0.25;1" dur="7.5s" begin="4.5s" repeatCount="indefinite"/>
      </rect>
      <text x="685" y="217">DEPLOY</text>
    </g>
    <g>
      <rect x="805" y="192" width="130" height="40" rx="10" fill="#1E1B4B" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.35">
        <animate attributeName="stroke-opacity" values="1;0.35;0.35" keyTimes="0;0.25;1" dur="7.5s" begin="6s" repeatCount="indefinite"/>
      </rect>
      <text x="870" y="217">MONITOR</text>
    </g>
  </g>

  <!-- data packet travelling the pipeline -->
  <path id="flow" d="M130,212 H870" fill="none" stroke="none"/>
  <circle r="5" fill="#E0E7FF" filter="url(#glow)">
    <animateMotion dur="7.5s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.8;1" calcMode="linear">
      <mpath xlink:href="#flow"/>
    </animateMotion>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.79;0.82;1" dur="7.5s" repeatCount="indefinite"/>
  </circle>
</svg>
